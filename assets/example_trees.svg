<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="796" viewBox="0 0 1570 796" role="img" aria-labelledby="title desc">
  <title id="title">Intervention sandbox cropped UI</title>
  <desc id="desc">Vector recreation of the Intervention sandbox screenshot, starting from the prompt label and omitting the top header bars. Automatically switches between light and dark themes.</desc>

  <style>
    :root{
      color-scheme: light dark;
      --page:#ffffff;
      --field:#ffffff;
      --border:#c9c9c9;
      --text:#171717;
      --muted:#6d6d6d;
      --soft:#ececec;
      --accent:#cc5c27;
      --icon:#6e6e6e;
      --spinner:#ececf0;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --page:#222222;
        --field:#292929;
        --border:#565656;
        --text:#f1f1f1;
        --muted:#b6b6b6;
        --soft:#3a3431;
        --accent:#cf5f2a;
        --icon:#aaa;
        --spinner:#2f2e37;
      }
    }

    .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .mono{font-family:"SFMono-Regular",Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .label{font-size:17px;font-weight:500;letter-spacing:1.8px;fill:var(--muted)}
    .fieldtext{font-size:24px;fill:var(--text)}
    .btn{font-size:22px;font-weight:700;fill:white}
    .resultHead{font-size:24px;font-weight:700;fill:var(--text)}
    .body{font-size:22px;fill:var(--text)}
    .mutedmono{font-size:21px;fill:var(--muted)}
    .ticks{font-size:15px;fill:var(--muted)}
    .stroke{stroke:var(--border);stroke-width:2;vector-effect:non-scaling-stroke}
    .thin{stroke:var(--border);stroke-width:1.5;vector-effect:non-scaling-stroke}
  </style>

  <!-- shell -->
  <rect x="2" y="2" width="1566" height="792" fill="var(--page)" class="stroke"/>

  <!-- prompt -->
  <text x="40" y="35" class="sans label">PROMPT</text>
  <rect x="40" y="53" width="1488" height="186" fill="var(--field)" class="stroke"/>
  <text x="64" y="101" class="sans fieldtext">Yesterday i was driving on the highway and</text>
  <g stroke="var(--icon)" stroke-width="1.8">
    <line x1="1499" y1="236" x2="1525" y2="210"/>
    <line x1="1506" y1="237" x2="1526" y2="217"/>
    <line x1="1515" y1="237" x2="1526" y2="226"/>
  </g>

  <!-- lower controls -->
  <text x="40" y="281" class="sans label">FEATURE</text>
  <rect x="40" y="299" width="838" height="76" fill="var(--field)" class="stroke"/>
  <text x="61" y="347" class="sans fieldtext">17085: Tree/Trees</text>
  <polyline points="841,331 848,338 855,331" fill="none" stroke="var(--icon)" stroke-width="2.2"/>

  <text x="904" y="281" class="sans label">TARGET ACTIVATION (% OF FEATURE MAX)</text>
  <line x1="904" y1="326" x2="1224" y2="326" stroke="var(--border)" stroke-width="6"/>
  <line x1="904" y1="326" x2="1015" y2="326" stroke="var(--accent)" stroke-width="6"/>
  <rect x="1001" y="311" width="29" height="30" fill="var(--field)" stroke="var(--accent)" stroke-width="4"/>

  <text x="901" y="368" class="mono ticks">50%</text>
  <text x="996" y="368" class="mono ticks">100%</text>
  <text x="1094" y="368" class="mono ticks">150%</text>
  <text x="1192" y="368" class="mono ticks">200%</text>

  <rect x="1248" y="299" width="164" height="76" fill="var(--field)" class="stroke"/>
  <text x="1269" y="347" class="sans fieldtext">4.57</text>
  <rect x="1353" y="319" width="35" height="36" fill="var(--spinner)"/>
  <polyline points="1366,331 1372,325 1378,331" fill="none" stroke="var(--icon)" stroke-width="2.4"/>
  <polyline points="1366,341 1372,347 1378,341" fill="none" stroke="var(--icon)" stroke-width="2.4"/>

  <rect x="40" y="404" width="295" height="76" fill="var(--accent)"/>
  <text x="70" y="452" class="sans btn">Generate comparison</text>

  <!-- table -->
  <line x1="3" y1="517" x2="1567" y2="517" class="stroke"/>
  <line x1="785" y1="517" x2="785" y2="794" class="stroke"/>
  <line x1="3" y1="583" x2="1567" y2="583" class="thin"/>

  <text x="28" y="561" class="sans resultHead">Unmodified</text>
  <text x="811" y="561" class="sans resultHead">Intervened</text>

  <!-- left result -->
  <rect x="31" y="617" width="556" height="26" fill="var(--soft)"/>
  <text x="31" y="640" class="mono mutedmono">Yesterday i was driving on the highway and</text>
  <text x="600" y="640" class="mono body">saw a car</text>
  <text x="31" y="676" class="mono body">with 2 people in it. One of them is wearing glasses,</text>
  <text x="31" y="712" class="mono body">but he doesn't have any hair. The other one has no</text>
  <text x="31" y="748" class="mono body">glasses or hair at all.</text>

  <!-- right result -->
  <rect x="814" y="617" width="556" height="26" fill="var(--soft)"/>
  <text x="814" y="640" class="mono mutedmono">Yesterday i was driving on the highway and</text>
  <text x="1382" y="640" class="mono body">saw a tree</text>
  <text x="814" y="676" class="mono body">in front of me. It had been cut down by someone, but</text>
  <text x="814" y="712" class="mono body">it still stood there with its roots intact.</text>
  <text x="814" y="748" class="mono body">I thought about what I could do to help this</text>
</svg>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1570"
  height="684"
  viewBox="0 0 1570 684"
  role="img"
  aria-labelledby="title desc"
>
  <style>
    text {
      fill: #171717;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .page { fill: #fff; stroke: #c9c9c9; }
    .field { fill: #fff; stroke: #c9c9c9; }
    .soft { fill: #ececec; }
    .spinner { fill: #ececf0; }
    .border { stroke: #c9c9c9; }
    .icon { fill: none; stroke: #6e6e6e; }
    .muted { fill: #6d6d6d; }
    .accent-fill { fill: #cc5c27; }
    .accent-stroke { stroke: #cc5c27; }

    @media (prefers-color-scheme: dark) {
      text { fill: #f1f1f1; }
      .page { fill: #222; stroke: #565656; }
      .field { fill: #292929; stroke: #565656; }
      .soft { fill: #3a3431; }
      .spinner { fill: #2f2e37; }
      .border { stroke: #565656; }
      .icon { stroke: #aaa; }
      .muted { fill: #b6b6b6; }
    }

    .label {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 1.8px;
    }

    .field-text { font-size: 24px; }
    .button-text { fill: #fff; font-size: 22px; font-weight: 700; }
    .result-heading { font-size: 24px; font-weight: 700; }

    .mono {
      font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .result-prefix { font-size: 21px; }
    .result-body { font-size: 22px; }
    .tick { font-size: 15px; }
  </style>

  <!-- Page shell -->
  <rect class="page" x="1" y="1" width="1568" height="682" stroke-width="2"/>

  <!-- Prompt -->
  <g id="prompt">
    <text class="label muted" x="40" y="35">PROMPT</text>
    <rect class="field" x="40" y="53" width="1488" height="94" stroke-width="2"/>
    <text class="field-text" x="64" y="101">Yesterday i was driving on the highway and</text>

    <g class="icon" stroke-width="1.8" stroke-linecap="square">
      <path d="M1499 144l26-26"/>
      <path d="M1506 145l20-20"/>
      <path d="M1515 145l11-11"/>
    </g>
  </g>

  <!-- Controls -->
  <g id="controls">
    <text class="label muted" x="40" y="193">FEATURE</text>
    <rect class="field" x="40" y="210" width="838" height="76" stroke-width="2"/>
    <text class="field-text" x="61" y="259">17085: Tree/Trees</text>
    <path class="icon" d="M841 242l7 7 7-7" stroke-width="2.2"/>

    <text class="label muted" x="904" y="193">TARGET ACTIVATION (% OF FEATURE MAX)</text>

    <g id="activation-slider">
      <line class="border" x1="904" y1="237" x2="1224" y2="237" stroke-width="6"/>
      <line class="accent-stroke" x1="904" y1="237" x2="1015" y2="237" stroke-width="6"/>
      <rect class="field accent-stroke" x="1001" y="222" width="29" height="30" stroke-width="4"/>

      <text class="mono tick muted" x="900" y="280">50%</text>
      <text class="mono tick muted" x="996" y="280">100%</text>
      <text class="mono tick muted" x="1094" y="280">150%</text>
      <text class="mono tick muted" x="1192" y="280">200%</text>
    </g>

    <g id="activation-input">
      <rect class="field" x="1248" y="210" width="164" height="76" stroke-width="2"/>
      <text class="field-text" x="1268" y="259">4.57</text>
      <rect class="spinner" x="1353" y="230" width="35" height="36"/>
      <path class="icon" d="M1366 242l6-6 6 6" stroke-width="2.4"/>
      <path class="icon" d="M1366 252l6 6 6-6" stroke-width="2.4"/>
    </g>

    <g id="generate-button">
      <rect class="accent-fill" x="40" y="315" width="295" height="76"/>
      <text class="button-text" x="70" y="363">Generate comparison</text>
    </g>
  </g>

  <!-- Results -->
  <g id="results">
    <line class="border" x1="2" y1="428" x2="1568" y2="428" stroke-width="2"/>
    <line class="border" x1="785" y1="428" x2="785" y2="684" stroke-width="2"/>
    <line class="border" x1="2" y1="494" x2="1568" y2="494" stroke-width="1.5"/>

    <text class="result-heading" x="28" y="473">Unmodified</text>
    <text class="result-heading" x="810" y="473">Intervened</text>

    <g id="unmodified-result">
      <rect class="soft" x="31" y="529" width="556" height="26"/>
      <text class="mono result-prefix muted" x="31" y="551">Yesterday i was driving on the highway and</text>
      <text class="mono result-body" x="601" y="552">saw a car</text>
      <text class="mono result-body" x="31" y="588">with 2 people in it. One of them is wearing glasses,</text>
      <text class="mono result-body" x="31" y="624">but he doesn't have any hair. The other one has no</text>
      <text class="mono result-body" x="31" y="660">glasses or hair at all.</text>
    </g>

    <g id="intervened-result">
      <rect class="soft" x="814" y="529" width="556" height="26"/>
      <text class="mono result-prefix muted" x="814" y="551">Yesterday i was driving on the highway and</text>
      <text class="mono result-body" x="1383" y="552">saw a tree</text>
      <text class="mono result-body" x="814" y="588">in front of me. It had been cut down by someone, but</text>
      <text class="mono result-body" x="814" y="624">it still stood there with its roots intact.</text>
      <text class="mono result-body" x="814" y="660">I thought about what I could do to help this</text>
    </g>
  </g>
</svg>

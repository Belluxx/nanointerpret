<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title description">
  <title id="title">NanoInterpret</title>
  <desc id="description">A minimal diagram of a residual stream passing through a sparse feature bottleneck.</desc>

  <style>

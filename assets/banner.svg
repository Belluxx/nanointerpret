    .faint { fill: #d7d7d1; }
    .faint-stroke { stroke: #d7d7d1; }
    .foreground-stroke { stroke: #171717; }

    @media (prefers-color-scheme: dark) {
      .background, .hollow { fill: #171717; }
      .foreground { fill: #f0f0ec; }
      .muted { fill: #858581; }
      .faint { fill: #383836; }
      .faint-stroke { stroke: #383836; }
      .foreground-stroke { stroke: #f0f0ec; }
    }
  </style>


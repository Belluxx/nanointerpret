<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1128" viewBox="0 0 1000 1128" role="img" aria-labelledby="title description">
<title id="title">Feature interpretation pipeline</title>
<desc id="description">For each feature, interpret.py samples recorded activations, an LLM names the feature from 20 excerpts, a fresh call checks the name on 24 held-out tokens, the LLM writes 6 test pairs that the studied model and SAE score, a failing name is revised once, and the feature's decoder direction is steered to find the tokens it promotes. Results go to interpretations.jsonl and the explorer.</desc>
<style>.bg{fill:#F6F6F4}.lane{fill:#EDEDEA}.card{fill:#FFFFFF}.ink{fill:#222221}.ink2{fill:#565653}.muted{fill:#8C8C87}.wire{fill:none;stroke:#8C8C87;stroke-width:1.3}.head{fill:#8C8C87}.decision{fill:#FFFFFF;stroke:#8C8C87;stroke-width:1.3}.pill{fill:#EB6834;fill-opacity:.13}.dot{fill:#EB6834}@media (prefers-color-scheme: dark){.bg{fill:#181817}.lane{fill:#121211}.card{fill:#1F1F1E}.ink{fill:#E9E9E6}.ink2{fill:#B5B5B0}.muted{fill:#85857F}.wire{stroke:#85857F}.head{fill:#85857F}.decision{fill:#1F1F1E;stroke:#85857F}.pill{fill:#D95926;fill-opacity:.22}.dot{fill:#D95926}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="1128"/>
<rect class="lane" x="16" y="16" width="312" height="984"/>
<rect class="lane" x="344" y="16" width="312" height="984"/>
<rect class="lane" x="672" y="16" width="312" height="984"/>
<text x="36" y="46" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="600">Recorded activations</text>
<text x="36" y="66" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start">record_activations.py index</text>
<text x="36" y="84" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start">read only, no model runs</text>
<text x="364" y="46" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="600">Explainer and judge LLM</text>
<text x="364" y="66" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start">e.g. gemma-4-31B-it on llama-server</text>
<text x="364" y="84" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start">3 calls per feature, 6 if revised</text>
<text x="692" y="46" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" font-weight="600">Studied model + SAE</text>
<text x="692" y="66" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start">e.g. Qwen3 1.7B, run by interpret.py</text>
<text x="692" y="84" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start">13 passes per feature, 25 if revised</text>
<rect class="card" x="36" y="112" width="272" height="116"/>
<text x="52" y="138" class="muted" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">1</text>
<text x="70" y="138" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Sample</text>
<text x="52" y="160" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">the 8 strongest activations, plus</text>
<text x="52" y="178" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">3 from each activation-quantile bin:</text>
<text x="52" y="196" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">0–50 · 50–80 · 80–95 · 95–100%</text>
<text x="52" y="214" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">32 tokens before, 8 after each</text>
<rect class="card" x="364" y="260" width="272" height="98"/>
<text x="380" y="286" class="muted" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">2</text>
<text x="398" y="286" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Explain</text>
<text x="380" y="308" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">reads the excerpts, firing tokens</text>
<text x="380" y="326" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">marked with a 1–10 activation, and</text>
<text x="380" y="344" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">the tokens it fires on most</text>
<rect class="card" x="36" y="398" width="272" height="120"/>
<text x="52" y="424" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Held-out tokens</text>
<text x="52" y="446" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">12 firing: 3 from each bin</text>
<text x="52" y="464" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">12 silent: 4 random, 4 of its usual</text>
<text x="52" y="482" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">tokens where it stays silent, 4 of</text>
<text x="52" y="500" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">the nearest feature&#x27;s activations</text>
<rect class="card" x="364" y="398" width="272" height="120"/>
<text x="380" y="424" class="muted" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">3</text>
<text x="398" y="424" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Detect</text>
<text x="380" y="446" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">a fresh call sees only the name and</text>
<text x="380" y="464" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">says whether each token fires</text>
<rect class="pill" x="380" y="478" width="140" height="22" rx="11"/>
<circle class="dot" cx="392" cy="489" r="3.5"/>
<text x="402" y="493" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="500">balanced accuracy</text>
<rect class="card" x="364" y="558" width="272" height="128"/>
<text x="380" y="584" class="muted" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">4</text>
<text x="398" y="584" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Write tests</text>
<text x="380" y="606" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">6 pairs from the name: a text that</text>
<text x="380" y="624" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">should fire and a minimal contrast</text>
<text x="380" y="642" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">that should stay silent</text>
<rect class="card" x="692" y="558" width="272" height="128"/>
<text x="708" y="584" class="muted" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">5</text>
<text x="726" y="584" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Measure</text>
<text x="708" y="606" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">runs each text to the SAE&#x27;s layer;</text>
<text x="708" y="624" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">a pair passes if the contrast stays</text>
<text x="708" y="642" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">under half the first text&#x27;s activation</text>
<rect class="pill" x="708" y="656" width="167" height="22" rx="11"/>
<circle class="dot" cx="720" cy="667" r="3.5"/>
<text x="730" y="671" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" font-weight="500">pass rate, of 6 pairs</text>
<rect class="card" x="364" y="712" width="272" height="96"/>
<text x="380" y="738" class="muted" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">6</text>
<text x="398" y="738" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Revise, once</text>
<text x="380" y="760" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">sees what each test text scored and</text>
<text x="380" y="778" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">writes a new name; the one with the</text>
<text x="380" y="796" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">higher detection + pass rate is kept</text>
<rect class="card" x="692" y="844" width="272" height="140"/>
<text x="708" y="870" class="muted" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="start">7</text>
<text x="726" y="870" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600">Steer</text>
<text x="708" y="892" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">adds the decoder direction at the</text>
<text x="708" y="910" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">SAE&#x27;s layer on 8 neutral prompts, at</text>
<text x="708" y="928" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">the strongest of 0.5–16× the max</text>
<text x="708" y="946" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">activation that keeps KL ≤ 1 nat</text>
<text x="708" y="964" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">→ the 10 tokens it promotes most</text>
<polygon class="decision" points="828,722 920,762 828,802 736,762"/>
<text x="828" y="767" class="ink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="600">4+ of 6 pass?</text>
<path class="wire" d="M308 150 L500 150 L500 256" marker-end="url(#arrow)"/>
<text x="364" y="142" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start">20 marked excerpts</text>
<path class="wire" d="M172 228 L172 394" marker-end="url(#arrow)"/>
<text x="182" y="316" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start">kept out of step 2</text>
<path class="wire" d="M308 434 L360 434" marker-end="url(#arrow)"/>
<path class="wire" d="M500 358 L500 394" marker-end="url(#arrow)"/>
<text x="510" y="381" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start">title + description</text>
<path class="wire" d="M500 518 L500 554" marker-end="url(#arrow)"/>
<text x="510" y="541" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start">the name</text>
<path class="wire" d="M636 616 L688 616" marker-end="url(#arrow)"/>
<text x="664" y="607" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">12 texts</text>
<path class="wire" d="M828 686 L828 718" marker-end="url(#arrow)"/>
<path class="wire" d="M736 762 L640 762" marker-end="url(#arrow)"/>
<text x="686" y="754" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">no, first try</text>
<path class="wire" d="M364 762 L352 762 L352 488 L360 488" marker-end="url(#arrow)"/>
<text x="364" y="703" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start">new name: steps 3–5 rerun</text>
<path class="wire" d="M828 802 L828 840" marker-end="url(#arrow)"/>
<text x="838" y="826" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start">yes, or revised</text>
<path class="wire" d="M828 984 L828 1020" marker-end="url(#arrow)"/>
<rect class="card" x="16" y="1024" width="968" height="88"/>
<text x="36" y="1052" class="ink" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13.5" text-anchor="start" font-weight="600">interpretations.jsonl</text>
<text x="216" y="1052" class="muted" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start">one line per feature, in the activation directory</text>
<text x="36" y="1074" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">title · description · detection scores · the 6 measured test pairs · generation scores · steering strength, KL and tokens</text>
<text x="36" y="1094" class="ink2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" text-anchor="start">explore.py lists named features first and shows the name, both scores, the test pairs and the steering tokens on each feature page</text>
</svg>

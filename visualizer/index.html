<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>MechBox — Feature visualizer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <h1>MechBox</h1>
          <p>SAE feature visualizer</p>
        </div>
        <dl class="dataset-meta" id="dataset-meta" aria-label="Analysis metadata">
          <div><dt>Model</dt><dd>Loading…</dd></div>
        </dl>
      </header>

      <section class="browser" aria-label="Feature browser">
        <header class="toolbar">
          <input
            id="search-input"
            type="search"
            placeholder="Search by title or feature ID"
            aria-label="Search features"
            autocomplete="off"
          />

          <label>
            <span>Sort</span>
            <select id="sort-select">
              <option value="id">Feature ID</option>
              <option value="max">Peak activation</option>
              <option value="count">Activation count</option>
              <option value="title">Title</option>
            </select>
          </label>
        </header>

        <div class="list-heading">
          <span id="result-count" role="status">Loading analysis…</span>
          <span class="column-labels" aria-hidden="true">
            <span>Activations</span><span>Peak</span>
          </span>
        </div>

        <div id="error-message" class="error-message" hidden></div>
        <div id="feature-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>

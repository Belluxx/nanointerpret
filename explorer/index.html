<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' fill='%231A1A1A'/%3E%3Crect x='4' y='9' width='2' height='4' fill='%23fff'/%3E%3Crect x='7' y='4' width='2' height='9' fill='%23fff'/%3E%3Crect x='10' y='7' width='2' height='6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">nanointerpret<span>/explorer</span></a>
    <form class="search" id="search" autocomplete="off">
      <input id="query" type="search" placeholder="Feature # or token" aria-label="Feature number or token" spellcheck="false">
    </form>
    <button class="button" id="random" type="button" title="Random feature (R)">Random</button>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Feature list">
      <div class="list-controls">
        <select id="sort" aria-label="Sort">
          <option value="density">Density ↓</option>
          <option value="rarity">Density ↑</option>
          <option value="max">Max activation ↓</option>
          <option value="id">Feature #</option>
        </select>
      </div>
      <div class="range-filter" id="range-filter" hidden></div>
      <div class="list" id="list" role="list"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>

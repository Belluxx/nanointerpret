<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Explorer</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#/">
      <img class="logo" src="/logo.svg" alt="">
      nanointerpret<span>explorer</span>
    </a>
    <form id="search" role="search">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/></svg>
      <input id="query" type="search" placeholder="Search features" aria-label="Search feature names and descriptions" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </form>
    <div class="sidebar-head">
      <span>
        Features<span id="count"></span>
        <button class="filter" id="filter" type="button" popovertarget="filters" title="Filters" aria-label="Filters" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M4.5 8h7M6.5 11.5h3"/></svg>
        </button>
      </span>
      <select id="sort" aria-label="Sort">
        <option value="density">Density ↓</option>
        <option value="rarity">Density ↑</option>
        <option value="check">Name check ↓</option>
      </select>
    </div>
    <button class="range" id="range" type="button" title="Clear the density filter" hidden></button>
    <nav class="list" id="list"></nav>
  </aside>
  <main class="main" id="main"></main>
  <div class="filters" id="filters" popover>
    <label><input id="show-untrusted" type="checkbox">Show untrusted</label>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>

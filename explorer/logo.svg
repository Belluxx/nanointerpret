<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .pale { fill: #D9D9D5; }
    .weak { fill: #8C8C87; }
    .strong { fill: #222221; }

    @media (prefers-color-scheme: dark) {
      .pale { fill: #363634; }
      .weak { fill: #85857F; }
      .strong { fill: #E9E9E6; }
    }
  </style>
  <!-- A sparse code: one strong and one weak feature among nine. -->
  <rect class="pale" x="2" y="2" width="6" height="6"/>
  <rect class="pale" x="9" y="2" width="6" height="6"/>
  <rect class="strong" x="16" y="2" width="6" height="6"/>
  <rect class="weak" x="2" y="9" width="6" height="6"/>
  <rect class="pale" x="9" y="9" width="6" height="6"/>
  <rect class="pale" x="16" y="9" width="6" height="6"/>
  <rect class="pale" x="2" y="16" width="6" height="6"/>
  <rect class="pale" x="9" y="16" width="6" height="6"/>
  <rect class="pale" x="16" y="16" width="6" height="6"/>
</svg>
